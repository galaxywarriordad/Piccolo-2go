# /boot/ax-2go.conf — Piccolo-2go v1.1 User Hardware Overrides (Optimised with AX Tech)
# Edit this plain-text file on the FAT32 BOOT partition from Windows, macOS, or Linux.
# Primary DAC: HiBy FC3 (£29.61, ES9281 PRO / ES9281AC Pro, 1.3 Vrms fc3_1v3 profile) + 3.5mm Moondrop Chu.
# Backup USB-C DACs: JCALLY JM6 Pro (£12.99, CX31993 + MAX97220) and HiBy Digital D1 (£11.11, CS46L41) via ax-audio-route.
# Internal Fallback: RK817 codec | Video Playback: 640x480 mpv (/userdata/movies).

# Hardware Profile Preset (sets baseline clocks unless overridden below):
# safe = 1296 MHz CPU (1100.0 mV) | 520 MHz GPU (1100000 uV) | 666 MHz DDR3 (1100.0 mV)
# default = 1344 MHz CPU (1112.5 mV) | 600 MHz GPU (1137500 uV) | 720 MHz DDR3 (1112.5 mV)
# oc_boost = 1392 MHz CPU | 620 MHz GPU (1162500 uV) | 786+ MHz DDR3
HW_PROFILE=default

# Safe RK3326 CPU PLL Ceiling (24 MHz increments, passive-cooled safe):
# 1.34 = 1344 MHz (Default Mode, ~52-58C)
# 1.30 = 1296 MHz (Safe Mode / Pure Audio Power Floor, ~42-52C)
# 1.39 = 1392 MHz (OC/Boost Mode, guarded by 75C auto-rollback in ax-powerd)
CPU_PROFILE=1.34

# Mali-G31 MP2 GPU Clock & RK817 VDD_LOGIC (12.5 mV / 12500 uV steps):
# 520 = 520 MHz (Safe / Baseline @ 1100000 uV)
# 550 = 550 MHz (Mild Step +1 @ 1112500 uV)
# 580 = 580 MHz (Mid Step +2 @ 1125000 uV)
# 600 = 600 MHz (Default Ceiling @ 1137500 uV)
# 620 = 620 MHz (OC/Boost Custom Push @ 1150000-1162500 uV; requires DTB OPP support)
GPU_FREQ=600

# LPDDR3 / DMC Bus Profile (RK817 DCDC2 VDD_LOGIC, 12.5 mV / 12500 uV steps):
# 720 = 720 MHz (1440 MT/s @ 1112.5 mV / 1112500 uV Default)
# 666 = 666 MHz (1333 MT/s @ 1100.0 mV / 1100000 uV Safe Mode)
# 786 = 786 MHz (1572 MT/s High Profile)
# 800 = 800 MHz (1600 MT/s @ 1137.5 mV Open-Case / Heatsink Only)
DDR_FREQ=720

# SD Card Profile (TF1 64GB OS/Saves + TF2 128GB Media on RK3326 3.3V SDMMC0/1):
# sdr50_pro = 50 MHz SDR50 for SanDisk Extreme PRO (A2/V30) cards (Default)
# hs_compat = 25 MHz High-Speed fallback for CRC-sensitive or older/clone cards
# audio_quiet = Low-I/O profile paired with 64 MiB FLAC_AX RAM preload on Core 3
SD_PROFILE=sdr50_pro

# Block Device Read-Ahead in KB for mmcblk0 / mmcblk1 (128..512):
SD_READAHEAD_KB=256

# Audio Routing Gain & RK817 Speaker Guard (used by /usr/sbin/ax-audio-route):
# PRIMARY_VOL = Default volume scale for HiBy FC3 (fc3_1v3)
# BACKUP_VOL = Conservative starting scale for JCALLY JM6 Pro / HiBy Digital D1
# ALLOW_SPEAKER_WITH_DAC = 0 (mute RK817 speaker when USB DAC active) | 1 (allow)
PRIMARY_VOL=0.65
BACKUP_VOL=0.45
ALLOW_SPEAKER_WITH_DAC=0

# Front Status LED Control (tames the bright blue/red front LED in dark rooms):
# off = Disable front status LEDs after boot
# on = Keep default system status LEDs enabled
LED_MODE=off

# Default Mali-G31 MP2 GPU Governor at Idle/TUI (FBNeo uses performance):
# simple_ondemand = Power-saving idle during FLAC_AX DAP playback
# performance = Lock max GPU OPP clock continuously
GPU_IDLE_GOV=simple_ondemand
