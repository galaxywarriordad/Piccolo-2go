odroidgoa-uboot-config

# BATLEXP G350 / R36S Hardware Clocks (Optimised with AX Tech):
# - CPU: 1296 MHz safe ceiling (1344 / 1392 MHz PLL steps via /boot/ax-cpu.conf)
# - GPU: 520 MHz stock ceiling (550 / 600 / 650-660 MHz @ 1112.5-1175.0 mV DTB OPP)
# - DDR3: 720 MHz (1440 MT/s @ 1112.5 mV) default | 666 MHz safe backup | 800-900 MHz open-case
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=squashfs ro rootwait isolcpus=0,1,2 nohz_full=0,1,2 rcu_nocbs=0,1,2 threadirqs net.ifnames=0 fbcon=rotate:0 console=ttyFIQ0,1500000n8 consoleblank=0 loglevel=3 quiet max_cpufreq=1296 boot_cpufreq=1248 max_gpufreq=520 max_ddrfreq=720"

setenv loadaddr "0x02000000"
setenv initrd_loadaddr "0x01100000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${initrd_loadaddr} uInitrd
load mmc 1:1 ${dtb_loadaddr} rk3326-g350-linux.dtb

booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
