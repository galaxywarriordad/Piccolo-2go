image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"Image",
			"uInitrd",
			"rk3326-g350-linux.dtb",
			"boot.ini"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
}
