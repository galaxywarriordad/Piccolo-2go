odroidgoa-uboot-config

# BATLEXP G350 / R36S Hardware Clocks (Piccolo-2go v1.1, Optimised with AX Tech):
# - CPU: 1344 MHz Default (1296 MHz Safe / Audio Floor | 1392 MHz OC/Boost via /boot/ax-2go.conf)
# - GPU: 600 MHz Default (520 MHz Safe | 550 / 580 MHz steps | 620 MHz OC/Boost @ 12.5 mV VDD_LOGIC steps)
# - DDR3: 720 MHz (1440 MT/s @ 1112.5 mV) Default | 666 MHz Safe | 786-800+ MHz High / Open-Case
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=squashfs ro rootwait isolcpus=0,1,2 nohz_full=0,1,2 rcu_nocbs=0,1,2 threadirqs net.ifnames=0 fbcon=rotate:0 console=ttyFIQ0,1500000n8 consoleblank=0 loglevel=3 quiet max_cpufreq=1344 boot_cpufreq=1344 max_gpufreq=600 max_ddrfreq=720"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv logo_loadaddr "0x03000000"

# Render Piccolo-2go U-Boot splash logo before kernel decompression
if load mmc 1:1 ${logo_loadaddr} logo.bmp; then
    bmp display ${logo_loadaddr} 0 0
fi

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${dtb_loadaddr} rk3326-g350-linux.dtb

booti ${loadaddr} - ${dtb_loadaddr}
