image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"Image",
			"rk3326-g350-linux.dtb",
			"boot.ini",
			"logo.bmp",
			"ax-2go.conf"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition idbloader {
		in-partition-table = "no"
		image = "idbloader.img"
		offset = 32K
	}

	partition uboot {
		in-partition-table = "no"
		image = "u-boot.itb"
		offset = 8M
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
}
