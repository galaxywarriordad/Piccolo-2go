# Piccolo-2go Deterministic RetroArch + FBNeo Configuration (BATLEXP G350 & R36S)
# Designed for primary HiBy FC3 (£29.61, ES9281 PRO / ES9281AC Pro), backup JCALLY JM6 Pro (£12.99)
# & HiBy Digital D1 (£11.11) USB-C DACs via ax-audio-route, or internal RK817 fallback.
video_driver = "glcore"
video_context_driver = "kms"
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_vsync = "true"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_threaded = "false"

# Direct ALSA Core 0 Audio (Zero Resampling)
audio_driver = "alsathread"
audio_out_rate = "48000"
audio_resampler = "nearest"
audio_latency = "16"
audio_sync = "true"

# Zero-Config GO-Super Gamepad Autoconfig & Hotkey Alignment (BATLEXP G350 & R36S)
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/etc/retroarch-joypads"
# FN maps to BTN_TRIGGER_HAPPY5 / BTN_MODE on RK3326 handhelds; verify exact button index
# via evtest on your target board if autoconfig assigns a different joypad index.
input_enable_hotkey_btn = "nul"
input_menu_toggle_btn = "nul"
input_exit_emulator_btn = "nul"

# Performance & Storage Discipline (TF2 128 GB Media Card)
libretro_directory = "/usr/lib/libretro"
system_directory = "/userdata/bios"
savefile_directory = "/userdata/saves"
savestate_directory = "/userdata/saves"
rgui_browser_directory = "/userdata/roms/fbneo"
menu_driver = "rgui"
```[cite: 27]

### 2. `.github/workflows/ci.yml`

```yaml
name: Validate Piccolo-2go External Tree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-aarch64-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Piccolo-2go
        uses: actions/checkout@v5

      - name: Install Lint & Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck gcc

      - name: Validate Shell Scripts, Udev Rules, Packages & C Utilities
        run: |
          sh -n \
            board/piccolo-2go/post-build.sh \
            board/piccolo-2go/post-image.sh \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S01piccolo-2go-isolate \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S02piccolo-2go-storage \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S03piccolo-2go-powerd \
            board/piccolo-2go/rootfs-overlay/usr/sbin/ax-audio-route
          shellcheck -x \
            board/piccolo-2go/post-build.sh \
            board/piccolo-2go/post-image.sh \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S01piccolo-2go-isolate \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S02piccolo-2go-storage \
            board/piccolo-2go/rootfs-overlay/etc/init.d/S03piccolo-2go-powerd \
            board/piccolo-2go/rootfs-overlay/usr/sbin/ax-audio-route
          gcc -O2 -Wall -Wextra -Werror package/piccolo-2go-tools/src/dtb-select.c -o /tmp/dtb-select
          gcc -O2 -Wall -Wextra -Werror package/piccolo-2go-tools/src/ax-powerd.c -o /tmp/ax-powerd
          gcc -O2 -Wall -Wextra -Werror package/piccolo-2go-tools/src/ax-boot-recovery.c -o /tmp/ax-boot-recovery
          test -f external.desc
          test -f external.mk
          test -f Config.in
          test -f configs/piccolo_2go_rk3326_defconfig
          test -f board/piccolo-2go/rootfs-overlay/etc/inittab
          test -f board/piccolo-2go/rootfs-overlay/etc/udev/rules.d/99-ax-2go-otg.rules
          grep -q 'ax-audio-route apply' board/piccolo-2go/rootfs-overlay/etc/udev/rules.d/99-ax-2go-otg.rules
          test -f package/ax-sdk/Config.in
          test -f package/ax-sdk/ax-sdk.mk
          test -f package/flac-ax/Config.in
          test -f package/flac-ax/flac-ax.mk

  build-sdcard-image:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-aarch64-tree
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free Runner Disk Space (~25 GB Reclaimed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Piccolo-2go
        uses: actions/checkout@v5
        with:
          path: Piccolo-2go

      - name: Install Buildroot Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make binutils patch gzip bzip2 perl tar cpio \
            unzip rsync file bc wget git python3 libncurses-dev libssl-dev \
            device-tree-compiler dosfstools mtools zip ca-certificates

      - name: Clone Buildroot
        run: |
          PROTO="https"
          HOST="github.com"
          REPO="buildroot/buildroot.git"
          git clone --depth=1 "${PROTO}://${HOST}/${REPO}" buildroot

      - name: Configure & Compile Piccolo-2go sdcard.img
        run: |
          cd buildroot
          make BR2_EXTERNAL="${GITHUB_WORKSPACE}/Piccolo-2go" piccolo_2go_rk3326_defconfig
          make -j"$(nproc)"

      - name: Package & Upload sdcard.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: piccolo-2go-rk3326-sdcard
          path: buildroot/output/images/sdcard.img
          compression-level: 6
          retention-days: 14
```[cite: 26]

### Verification Steps Before Running an Image Build

<Steps>
  <Step subtitle="Push & inspect CI" title="Commit retroarch-2go.cfg and ci.yml to main">
    Push both updated files to `main` on `galaxywarriordad/Piccolo-2go` and open the **Actions** tab.
    *Verification:* The `validate-aarch64-tree` job completes with `sh -n`, `shellcheck -x`, `gcc -Werror`, and the `99-ax-2go-otg.rules` check all passing.
  </Step>
  <Step subtitle="Verify FN button code" title="Check FN and START joypad button indices on hardware">
    When testing on your `RK3326` handheld, confirm which joypad button index `FN` (`BTN_TRIGGER_HAPPY5` / `BTN_MODE`) and `START` map to under `udev` so `input_enable_hotkey_btn`, `input_menu_toggle_btn`, and `input_exit_emulator_btn` match your autoconfig profile without accidental exits.
    *Verification:* Pressing `FN` toggles RGUI and `FN + START` exits `FBNeo` cleanly back to the launcher.
  </Step>
  <Step subtitle="Start low on IEMs" title="Keep starting volume low when testing the three USB-C DACs">
    Before inserting low-impedance `16Ω–18Ω` IEMs (`Moondrop Chu`), set a low volume and verify `HiBy FC3` (`£29.61`), `JCALLY JM6 Pro` (`£12.99`), and `HiBy Digital D1` (`£11.11`) one at a time.
    *Verification:* Playback starts cleanly at a comfortable low level with zero speaker bleed or underruns.
  </Step>
</Steps>

<Callout title="Start Low Before Using Sensitive IEMs" type="warning">
  USB DAC/amp dongles can drive low-impedance 16Ω–18Ω IEMs loudly; always lower volume before putting earphones in your ears.
</Callout>

