# /boot/ax-2go.conf — Piccolo-2go User Hardware Overrides (Optimised with AX Tech)
# Edit this plain-text file on the FAT32 BOOT partition from Windows, macOS, or Linux.
# Note: Audio volume is intentionally managed directly by your HiBy FC3 hardware DAC.

# Safe RK3326 CPU PLL Ceiling (24 MHz increments, passive-cooled safe):
#   1.30 = 1296 MHz (Official Stock Safe Default, ~42-52C)
#   1.34 = 1344 MHz (Sweet-Spot PLL Step +48 MHz, ~52-58C)
#   1.39 = 1392 MHz (High PLL Step +96 MHz, guarded by 75C auto-rollback)
CPU_PROFILE=1.30

# LPDDR3 / DMC Bus Profile (applied to boot.ini for next cold boot):
#   720 = 720 MHz (1440 MT/s @ 1112.5 mV Default)
#   666 = 666 MHz (1333 MT/s @ 1100.0 mV Universal Safe Backup)
#   800 = 800 MHz (1600 MT/s @ 1137.5 mV Open-Case / Heatsink Only)
DDR_FREQ=720

# Front Status LED Control (tames the bright blue/red front LED in dark rooms):
#   off = Disable front status LEDs after boot
#   on  = Keep default system status LEDs enabled
LED_MODE=off

# Default Mali-G31 MP2 GPU Governor at Idle/TUI (FBNeo automatically uses performance):
#   simple_ondemand = Power-saving 200 MHz idle during FLAC_AX DAP playback
#   performance     = Lock max GPU OPP clock continuously
GPU_IDLE_GOV=simple_ondemand
